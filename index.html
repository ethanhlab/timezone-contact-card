<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聯絡時差評估卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1d2330; --muted:#6a7080; --line:#dcd8cf;
  --sleep:#2b3a67; --work:#4f7fb8; --edge:#e8b04a; --awake:#3f9e86;
  --good:#2f8f6f; --good-bg:#e1f2ea; --ok:#a8741a; --ok-bg:#f8ecd2; --bad:#b4483f; --bad-bg:#f6dfdb;
  --accent:#2b3a67; --on-accent:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --panel:#1b202c; --ink:#e8e9ee; --muted:#9097a8; --line:#2d3342;
    --sleep:#4a5f9f; --work:#7fa6dc; --edge:#d9a23f; --awake:#4bb89d;
    --good:#5cc7a3; --good-bg:#1b3a31; --ok:#e3b45c; --ok-bg:#3a3019; --bad:#e58479; --bad-bg:#40221f;
    --accent:#8fa5e6; --on-accent:#12151d;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1b202c; --ink:#e8e9ee; --muted:#9097a8; --line:#2d3342;
  --sleep:#4a5f9f; --work:#7fa6dc; --edge:#d9a23f; --awake:#4bb89d;
  --good:#5cc7a3; --good-bg:#1b3a31; --ok:#e3b45c; --ok-bg:#3a3019; --bad:#e58479; --bad-bg:#40221f;
  --accent:#8fa5e6; --on-accent:#12151d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
select:focus-visible,input:focus-visible,button:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;min-height:44px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.swap{padding:9px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.clock{border-left:4px solid var(--line);padding:2px 0 2px 12px}
.clock .city{font-size:.85rem;color:var(--muted)}
.clock .t{font-size:2rem;font-weight:700;line-height:1.2}
.clock .d{font-size:.85rem;color:var(--muted)}
.diff{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.95rem}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;font-weight:500;margin-left:6px;vertical-align:middle}
.b-sleep{background:var(--sleep);color:#fff}
.b-edge{background:var(--edge);color:#2a1f05}
.b-awake{background:var(--awake);color:#fff}
.verdict{border-radius:12px;padding:14px 16px;margin-top:14px}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict b{font-size:1.2rem;display:block}
.verdict span{color:var(--ink);font-size:.92rem}
.ribbon-wrap{overflow-x:auto;padding-bottom:6px}
.ribbon{min-width:640px}
.lane{display:flex;align-items:center;gap:8px;margin:6px 0}
.lane .lbl{width:64px;flex:none;font-size:.82rem;color:var(--muted);text-align:right}
.cells{display:grid;grid-template-columns:repeat(48,1fr);flex:1;height:34px;border-radius:8px;overflow:hidden;position:relative}
.cells.thin{height:14px}
.cell{border:0;padding:0;min-height:0;border-radius:0;background:var(--line);position:relative}
.cell.sleep{background:var(--sleep)}
.cell.edge{background:var(--edge)}
.cell.awake{background:var(--awake)}
.cell.good{background:var(--good)}
.cell.ok{background:var(--edge)}
.cell.bad{background:var(--sleep);opacity:.55}
.cell.sel::after{content:"";position:absolute;top:0;bottom:0;left:0;right:0;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--panel) inset}
.ticks{display:grid;grid-template-columns:repeat(16,1fr);flex:1;font-size:.72rem;color:var(--muted)}
.ticks span{white-space:nowrap}
.ticks .nx{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wins{margin:0;padding:0;list-style:none}
.wins li{padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.wins li:first-child{border-top:0}
.wins .tag{font-weight:700}
.wins .g{color:var(--good)}
.wins .o{color:var(--ok)}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}
.lag p{margin:6px 0}
.lag ul{margin:6px 0 0;padding-left:20px}
.combo{position:relative}
.combo ul{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.combo ul[hidden]{display:none}
.combo li.opt{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:.92rem;line-height:1.35}
.combo li.opt .off{color:var(--muted);font-size:.8rem;white-space:nowrap}
.combo li.opt.active,.combo li.opt:hover{background:var(--bg)}
.combo li.grp{font-size:.75rem;color:var(--muted);padding:8px 10px 2px}
.combo li.empty{padding:8px 10px;color:var(--muted);font-size:.85rem}
.sleepbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tr input[type=time]{width:auto;flex:1;min-width:92px}
.tr[hidden],.typ[hidden]{display:none}
.typ{font-size:.9rem}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink);margin:0;font-size:.9rem;min-height:44px}
.chk input{width:auto;min-height:0}
.foot{margin-top:8px;padding:14px 4px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;line-height:1.7}
.foot p{margin:0 0 8px}
.foot b{color:var(--ink)}
.foot .by{color:var(--ink);font-size:.85rem}
.cell.work{background:var(--work)}
.b-work{background:var(--work);color:#fff}
.legend span[hidden]{display:none}
.workbox{margin-top:8px;display:grid;gap:6px}
.workbox select{min-height:44px}
.workbox[hidden]{display:none}
.themebtn{float:right;min-height:36px;padding:4px 10px;font-size:.85rem}
@media (max-width:560px){
  .sleepbox{grid-template-columns:1fr}
  .row{grid-template-columns:1fr 1fr}
  .row .swapcell{grid-column:1 / -1;order:3}
  .swap{width:100%}
  .clock .t{font-size:1.6rem}
  .pick{padding:10px}
  .pick h2{font-size:.9rem;margin-bottom:6px}
  .pick label{font-size:.72rem;margin-bottom:2px}
  .pick input,.pick button{min-height:32px;padding:4px 8px;font-size:.82rem;border-radius:7px}
  .pick input[type=date],.pick input[type=time]{-webkit-appearance:none;appearance:none;height:32px;line-height:1.2;font-size:.82rem}
  .pick input::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
  .pick .grid2{grid-template-columns:1fr;gap:8px}
  .pick input[type=date],.pick input[type=time]{width:calc(50% - 6px)}
  .pick .verdict{padding:8px 10px;margin-top:8px;border-radius:9px}
  .pick .verdict b{font-size:1rem}
  .pick .verdict span{font-size:.8rem}
  .pick #result>div:first-child{font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    </div>
    <div class="diff" id="diffBox"></div>
  </section>

  <section>
    <h2 data-i18n="s2"></h2>
    <div class="sleepbox">
      <div>
        <label data-i18n="mySleep"></label>
        <div class="tr"><input type="time" id="hBed" value="23:00" data-i18n-aria="bed"><span>–</span><input type="time" id="hWake" value="07:00" data-i18n-aria="wake"></div>
      </div>
      <div>
        <label data-i18n="theirSleep"></label>
        <div class="tr"><span class="typ" id="typTxt" data-i18n="typicalTxt"></span><label class="chk"><input type="checkbox" id="dCustom"><span data-i18n="customTxt"></span></label></div>
        <div class="tr" id="dCustomBox" hidden><input type="time" id="dBed" value="23:00" data-i18n-aria="bed"><span>–</span><input type="time" id="dWake" value="07:00" data-i18n-aria="wake"></div>
        <div class="workbox">
          <label class="chk"><input type="checkbox" id="dWorkOn" checked><span data-i18n="workLbl"></span></label>
          <div class="tr" id="dWorkBox"><input type="time" id="wStart" value="09:00" data-i18n-aria="workStartLbl"><span>–</span><input type="time" id="wEnd" value="18:00" data-i18n-aria="workEndLbl"></div>
          <select id="purpose" data-i18n-aria="purposeLbl"><option value="private"></option><option value="biz"></option></select>
        </div>
      </div>
    </div>
    <p class="note" data-i18n="sleepNote"></p>
  </section>

  <section class="pick">
    <h2 data-i18n="s3"></h2>
    <div class="grid2">
      <div><label for="date" data-i18n="dateLbl"></label><input type="date" id="date"></div>
      <div><label for="time" data-i18n="timeLbl"></label><input type="time" id="time" step="1800"></div>
    </div>
    <div style="margin-top:10px"><button id="nowBtn" data-i18n="nowBtn"></button></div>
    <div class="clocks">
      <div class="clock" id="clkHome"></div>
      <div class="clock" id="clkDest"></div>
    </div>
    <div id="result"></div>
  </section>

  <section>
    <h2 data-i18n="s5"></h2>
    <ul class="wins" id="wins"></ul>
  </section>

  <section>
    <h2 data-i18n="s4"></h2>
    <p class="note" style="margin-top:0" data-i18n="ribbonNote"></p>
    <div class="ribbon-wrap"><div class="ribbon" id="ribbon"></div></div>
    <div class="legend">
      <span><i style="background:var(--awake)"></i><em data-i18n="awake" style="font-style:normal"></em></span>
      <span><i style="background:var(--edge)"></i><em data-i18n="legEdge" style="font-style:normal"></em></span>
      <span><i style="background:var(--sleep)"></i><em data-i18n="sleep" style="font-style:normal"></em></span>
      <span id="legWork"><i style="background:var(--work)"></i><em data-i18n="legWork" style="font-style:normal"></em></span>
      <span><i style="background:var(--good)"></i><em data-i18n="legGood" style="font-style:normal"></em></span>
    </div>
  </section>

  <section class="lag">
    <h2 data-i18n="s6"></h2>
    <div id="lag"></div>
  </section>
  <footer class="foot">
    <p><b data-i18n="discTitle"></b> <span data-i18n="disclaimer"></span></p>
    <p class="by" data-i18n="credit"></p>
  </footer>
</main>

let LANG="zh",THEME="auto";
const detectLang=()=>{const n=(navigator.language||"").toLowerCase();return n.startsWith("zh")?"zh":n.startsWith("ja")?"ja":"en"};
try{const v=JSON.parse(localStorage.getItem("tzplanner")||"null");
  LANG=(v&&T[v.lang])?v.lang:detectLang();
  if(v&&["auto","light","dark"].includes(v.theme))THEME=v.theme;}catch(e){LANG=detectLang()}
const L=()=>T[LANG];

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};

function offsetMin(tz,ms){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"});
  const p={};f.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);
  const asUtc=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second);
  return Math.round((asUtc-Math.floor(ms/1000)*1000)/60000);
}
function zonedToUtc(dateStr,timeStr,tz){
  const [y,mo,d]=dateStr.split("-").map(Number),[h,mi]=timeStr.split(":").map(Number);
  const guess=Date.UTC(y,mo-1,d,h,mi);
  const o=offsetMin(tz,guess);let u=guess-o*60000;
  const o2=offsetMin(tz,u);if(o2!==o)u=guess-o2*60000;
  return u;
}
function local(tz,ms){
  const off=offsetMin(tz,ms),d=new Date(ms+off*60000);
  return {off,min:d.getUTCHours()*60+d.getUTCMinutes(),day:Math.floor((ms+off*60000)/86400000)};
}
function label(tz,ms){
  return new Intl.DateTimeFormat(L().dateLocale,{timeZone:tz,month:"short",day:"numeric",weekday:"short"}).format(new Date(ms));
}
function gmt(off){const s=off<0?"-":"+",a=Math.abs(off);return "UTC"+s+Math.floor(a/60)+(a%60?":"+pad(a%60):"")}

function status(m,bed,wake){
  const asleep=bed>wake?(m>=bed||m<wake):(m>=bed&&m<wake);
  if(asleep)return "sleep";
  const sinceWake=(m-wake+1440)%1440,untilBed=(bed-m+1440)%1440;
  if(sinceWake<60||untilBed<=60)return "edge";
  return "awake";
}

let S={home:"Asia/Taipei",dest:"America/Los_Angeles"};
let ID={home:"TPE",dest:"LAX"};
const nameOf=id=>id.startsWith("tz:")?id.slice(3).replace(/_/g," "):(CITY_BY_ID[id]||CITY_BY_ID.TPE)[LANG];

const TYP={bed:23*60,wake:7*60};
function cfg(){
  const custom=$("dCustom").checked;
  return {
    bedH:toMin($("hBed").value||"23:00"),wakeH:toMin($("hWake").value||"07:00"),
    bedD:custom?toMin($("dBed").value||"23:00"):TYP.bed,wakeD:custom?toMin($("dWake").value||"07:00"):TYP.wake,
    workOn:$("dWorkOn").checked,wS:toMin($("wStart").value||"09:00"),wE:toMin($("wEnd").value||"18:00"),purpose:$("purpose").value
  };
}
function updateSleepUI(){
  const c=$("dCustom").checked,w=$("dWorkOn").checked;
  $("typTxt").hidden=c;$("dCustomBox").hidden=!c;
  $("dWorkBox").hidden=!w;$("purpose").hidden=!w;$("legWork").hidden=!w;
}
function inWork(m,s0,e0){return s0<e0?(m>=s0&&m<e0):(m>=s0||m<e0)}
function evalAt(ms,c){
  const h=local(S.home,ms),d=local(S.dest,ms);
  const sh=status(h.min,c.bedH,c.wakeH),sd=status(d.min,c.bedD,c.wakeD);
  const work=c.workOn&&inWork(d.min,c.wS,c.wE);
  let r="good";
  if(sh==="sleep"||sd==="sleep")r="bad";else if(sh==="edge"||sd==="edge")r="ok";
  if(c.workOn&&r!=="bad"){
    if(c.purpose==="biz"){if(!work)r="bad"}
    else if(work&&r==="good")r="ok";
  }
  return {h,d,sh,sd,r,work};
}
function dayTag(dDay,baseDay){const x=dDay-baseDay;return x===0?"":x>0?L().next:L().prev}

function save(){
  try{localStorage.setItem("tzplanner",JSON.stringify({lang:LANG,theme:THEME,home:ID.home,dest:ID.dest,wStart:$("wStart").value,wEnd:$("wEnd").value,dWorkOn:$("dWorkOn").checked,purpose:$("purpose").value,hBed:$("hBed").value,hWake:$("hWake").value,dBed:$("dBed").value,dWake:$("dWake").value,dCustom:$("dCustom").checked}))}catch(e){}
}
function load(){
  let v=null;
  try{v=JSON.parse(localStorage.getItem("tzplanner")||"null")}catch(e){}
  try{
    if(v){if(v.home)ID.home=toId(v.home);if(v.dest)ID.dest=toId(v.dest);S.home=cityTz(ID.home);S.dest=cityTz(ID.dest);["hBed","hWake","dBed","dWake"].forEach(k=>{if(v[k])$(k).value=v[k]});$("dCustom").checked=!!v.dCustom;["wStart","wEnd"].forEach(k=>{if(v[k])$(k).value=v[k]});$("dWorkOn").checked=v.dWorkOn!==false;if(v.purpose)$("purpose").value=v.purpose;}
  }catch(e){}
  if(!(v&&v.home)){
    const id=deviceHomeId();
    if(id){
      ID.home=id;S.home=cityTz(id);
      if(S.dest===S.home){ID.dest="TPE";S.dest=cityTz("TPE")}
    }
  }
}

function setNowInHome(){
  const now=Date.now(),h=new Date(now+offsetMin(S.home,now)*60000);
  $("date").value=h.getUTCFullYear()+"-"+pad(h.getUTCMonth()+1)+"-"+pad(h.getUTCDate());
  const m=h.getUTCHours()*60+(h.getUTCMinutes()>=30?30:0);
  $("time").value=fmt(m);
}


const regName=k=>{const r=REG.find(x=>x[0]===k);return r[LANG==="zh"?1:LANG==="ja"?3:2]};
function setPlace(w,id){ID[w]=id;S[w]=cityTz(id);$(w).value=nameOf(id)}
function makeCombo(w){
  const input=$(w),list=$(w+"List");
  let opts=[],active=-1;
  const open=()=>{list.hidden=false;input.setAttribute("aria-expanded","true")};
  const close=()=>{list.hidden=true;input.setAttribute("aria-expanded","false");active=-1;input.value=nameOf(ID[w])};
  function score(c,n){
    const id=c.id.toLowerCase(),names=[c.zh,c.en,c.ja].map(x=>x.toLowerCase());
    const words=c.a.toLowerCase().split(/\s+/);
    if(id===n||names.includes(n))return 0;
    if(words.includes(n))return 1;
    if(names.some(x=>x.startsWith(n)))return 2;
    if(names.some(x=>x.includes(n)))return 3;
    if(id.startsWith(n)||words.some(x=>x.startsWith(n)))return 4;
    if((c.tz+" "+c.a).toLowerCase().includes(n))return 5;
    return -1;
  }
  function build(q){
    const raw=q.trim(),n=raw.toLowerCase(),now=Date.now(),l=L();
    const list0=n?CITIES.map(c=>({c,sc:score(c,n)})).filter(x=>x.sc>=0).sort((x,y)=>x.sc-y.sc).map(x=>x.c):CITIES;
    opts=list0.map(c=>({id:c.id,name:c[LANG],tz:c.tz,reg:c.reg}));
    if(raw.includes("/")){
      try{const z=new Intl.DateTimeFormat("en",{timeZone:raw}).resolvedOptions().timeZone;
        if(!opts.some(o=>o.tz===z))opts.push({id:"tz:"+z,name:z.replace(/_/g," "),tz:z,reg:"iana"});}catch(e){}
    }
    let html="",last=null;
    opts.forEach((o,i)=>{
      if(o.reg==="iana"){if(last!=="iana"){last="iana";html+=`<li class="grp" role="presentation">IANA</li>`}}
      else if(!n&&o.reg!==last){last=o.reg;html+=`<li class="grp" role="presentation">${regName(o.reg)}</li>`}
      html+=`<li class="opt" role="option" data-i="${i}" id="${w}Opt${i}"><span>${o.name}</span><span class="off">${gmt(offsetMin(o.tz,now))}</span></li>`;
    });
    if(!opts.length)html=`<li class="empty">${l.noRes}</li>`;
    list.innerHTML=html;active=(opts.length&&n)?0:-1;paint();open();
  }
  function paint(){
    list.querySelectorAll(".opt").forEach(li=>li.classList.toggle("active",+li.dataset.i===active));
    const el=list.querySelector(".opt.active");if(el)el.scrollIntoView({block:"nearest"});
  }
  function choose(i){const o=opts[i];if(!o)return;setPlace(w,o.id);close();input.blur();render()}
  input.addEventListener("focus",()=>{input.select();build("")});
  input.addEventListener("input",()=>build(input.value));
  input.addEventListener("blur",close);
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();if(list.hidden)build(input.value);active=Math.min(opts.length-1,active+1);paint()}
    else if(e.key==="ArrowUp"){e.preventDefault();active=Math.max(0,active-1);paint()}
    else if(e.key==="Enter"){e.preventDefault();choose(active>=0?active:0)}
    else if(e.key==="Escape"){close();input.blur()}
  });
  list.addEventListener("mousedown",e=>e.preventDefault());
  list.addEventListener("click",e=>{const li=e.target.closest(".opt");if(li)choose(+li.dataset.i)});
}
function deviceTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||null}catch(e){return null}}
// Device time zone -> default departure place. Anything currently on UTC+8 (East Asia time) maps to Taipei.
function deviceHomeId(){
  const z=deviceTz();if(!z)return null;
  try{if(offsetMin(z,Date.now())===480)return "TPE"}catch(e){return null}
  return toId(z);
}
function setNowFromDevice(){
  const id=deviceHomeId();
  if(id&&cityTz(id)!==S.home){setPlace("home",id);if(S.dest===S.home)setPlace("dest",ID.home==="TPE"?"LAX":"TPE")}
  const d=new Date();
  $("date").value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  $("time").value=pad(d.getHours())+":"+pad(d.getMinutes());
}
function applyTheme(){
  if(THEME==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",THEME);
}
function updateThemeBtn(){
  const k={auto:"themeAuto",light:"themeLight",dark:"themeDark"}[THEME];
  const icon={auto:"◐ ",light:"☀ ",dark:"☾ "}[THEME];
  $("themeBtn").textContent=icon+L()[k];
}
function applyStatic(){
  const l=L();
  document.documentElement.lang=LANG==="zh"?"zh-Hant":LANG==="ja"?"ja":"en";
  document.title=l.title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=l[el.dataset.i18n]});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",l[el.dataset.i18nAria])});
  $("swap").title=l.swapAria;
  $("langSel").value=LANG;
  $("purpose").options[0].textContent=l.purposePrivate;$("purpose").options[1].textContent=l.purposeBiz;
  updateThemeBtn();
  ["home","dest"].forEach(w=>{$(w).value=nameOf(ID[w]);$(w).placeholder=l.searchPh});
}

function render(){
  save();
  const l=L(),c=cfg();
  const date=$("date").value,time=$("time").value||"12:00";
  if(!date)return;
  const ms=zonedToUtc(date,time,S.home);
  const e=evalAt(ms,c);
  const hn=nameOf(ID.home),dn=nameOf(ID.dest);

  const clk=(el,name,tz,lc,st,wk)=>{
    el.style.borderLeftColor=`var(--${st==="sleep"?"sleep":st==="edge"?"edge":"awake"})`;
    el.innerHTML=`<div class="city">${name} (${gmt(lc.off)})</div><div class="t">${fmt(lc.min)}<span class="badge b-${st}">${l[st]}</span>${wk?`<span class="badge b-work">${l.workBadge}</span>`:""}</div><div class="d">${label(tz,ms)}</div>`;
  };
  clk($("clkHome"),hn,S.home,e.h,e.sh,false);
  clk($("clkDest"),dn,S.dest,e.d,e.sd,e.work);

  let dh=(e.d.off-e.h.off)/60;
  $("diffBox").innerHTML= dh===0?l.diffSame:l.diffBody(dn,hn,Math.abs(dh),dh>0);

  const who=[];
  if(e.sh==="sleep")who.push(l.whoSleepMe);if(e.sd==="sleep")who.push(l.whoSleepD(dn));
  if(e.sh==="edge")who.push(l.whoEdgeMe);if(e.sd==="edge")who.push(l.whoEdgeD(dn));
  if(c.workOn&&c.purpose==="private"&&e.work)who.push(l.whoWorkD(dn));
  if(c.workOn&&c.purpose==="biz"&&!e.work)who.push(l.whoOffD(dn));
  $("result").innerHTML=`
    <div>${l.resLine(hn,fmt(e.h.min),l[e.sh],dn,fmt(e.d.min),dayTag(e.d.day,e.h.day),l[e.sd])}</div>
    <div class="verdict ${e.r}"><b>${l[e.r][0]}</b><span>${who.length?who.join(l.whoJoin)+l.whoEnd:""}${l[e.r][1]}</span></div>`;

  const slots=[];
  for(let i=0;i<48;i++){
    const t=zonedToUtc(date,fmt(i*30),S.home);
    slots.push({t,i,ev:evalAt(t,c)});
  }
  const selIdx=Math.round(toMin(time)/30);
  const cells=(key,thin)=>`<div class="cells${thin?" thin":""}">`+slots.map(s=>{
    const cls=key==="h"?s.ev.sh:key==="d"?s.ev.sd:key==="w"?(s.ev.work?"work":"none"):s.ev.r;
    return `<button class="cell ${cls}${s.i===selIdx?" sel":""}" data-i="${s.i}" aria-label="${l.cellAria(fmt(s.i*30),fmt(s.ev.d.min),dn)}"></button>`;
  }).join("")+`</div>`;
  let tHome="",tDest="";
  for(let k=0;k<16;k++){
    const s=slots[k*3];
    tHome+=`<span>${pad(k*3)}</span>`;
    const dd=s.ev.d.day-s.ev.h.day;
    tDest+=`<span class="${dd!==0?"nx":""}">${pad(Math.floor(s.ev.d.min/60))}${s.ev.d.min%60?":"+pad(s.ev.d.min%60):""}${dd>0?"⁺¹":dd<0?"⁻¹":""}</span>`;
  }
  $("ribbon").innerHTML=`
    <div class="lane"><div class="lbl">${hn}</div><div class="ticks">${tHome}</div></div>
    <div class="lane"><div class="lbl"></div>${cells("h")}</div>
    <div class="lane"><div class="lbl">${dn}</div>${cells("d")}</div>
    <div class="lane"><div class="lbl"></div><div class="ticks">${tDest}</div></div>
    ${c.workOn?`<div class="lane"><div class="lbl">${l.workShort}</div>${cells("w",true)}</div>`:""}
    <div class="lane"><div class="lbl">${l.both}</div>${cells("r",true)}</div>`;
  $("ribbon").querySelectorAll(".cell").forEach(b=>b.onclick=()=>{$("time").value=fmt(+b.dataset.i*30);render()});

  const groups=[];
  slots.forEach(s=>{
    const r=s.ev.r;if(r==="bad")return;
    const last=groups[groups.length-1];
    if(last&&last.r===r&&last.end===s.i)last.end=s.i+1;else groups.push({r,start:s.i,end:s.i+1});
  });
  const fmtRange=g=>{
    const t1=zonedToUtc(date,fmt(g.start*30),S.home);
    const endMs=g.end>=48?zonedToUtc(date,"23:59",S.home)+60000:zonedToUtc(date,fmt(g.end*30),S.home);
    const a=local(S.dest,t1),b=local(S.dest,endMs),hb=local(S.home,t1);
    const endTxt=g.end>=48?"24:00":fmt(g.end*30);
    return l.range(hn,fmt(g.start*30),endTxt,dn,fmt(a.min),dayTag(a.day,hb.day),fmt(b.min),dayTag(b.day,hb.day));
  };
  const good=groups.filter(g=>g.r==="good"),ok=groups.filter(g=>g.r==="ok");
  let html="";
  if(!good.length)html+=`<li><span class="tag o">${l.noGood}</span> ${l.noGoodTxt}</li>`;
  good.forEach(g=>html+=`<li><span class="tag g">${l.best}</span>&nbsp; ${fmtRange(g)}</li>`);
  ok.forEach(g=>html+=`<li><span class="tag o">${l.maybe}</span>&nbsp; ${fmtRange(g)}</li>`);
  $("wins").innerHTML=html;

  let d=dh;if(d>12)d-=24;if(d<-12)d+=24;
  const ad=Math.abs(d);
  let lag="";
  if(ad===0){lag=`<p>${l.lagNone}</p>`;}
  else if(ad<=1){lag=`<p>${l.lagSmall(ad)}</p>`;}
  else{
    const east=d>0;
    const days=Math.ceil(ad*(east?1:0.6));
    const sd=Math.min(3,Math.ceil(ad));
    lag=`<p>${l.lagMain(hn,dn,ad,east)}</p><p>${l.lagDays(days)}</p><ul>${l.lagTips(east,sd,ad).map(x=>`<li>${x}</li>`).join("")}</ul>`;
  }
  $("lag").innerHTML=lag+`<p class="note">${l.lagNote}</p>`;
}

function init(){
  load();
  applyStatic();
  
  setNowInHome();
  makeCombo("home");
  makeCombo("dest");
  $("swap").onclick=()=>{const a=ID.home,b=ID.dest;setPlace("home",b);setPlace("dest",a);render()};
  $("nowBtn").onclick=()=>{setNowFromDevice();render()};
  ["date","time","hBed","hWake","dBed","dWake","wStart","wEnd"].forEach(id=>$(id).addEventListener("input",render));
  ["dWorkOn","purpose"].forEach(id=>$(id).addEventListener("change",()=>{updateSleepUI();render()}));
  $("dCustom").addEventListener("change",()=>{updateSleepUI();render()});
  updateSleepUI();
  $("langSel").onchange=()=>{LANG=$("langSel").value;applyStatic();render()};
  $("themeBtn").onclick=()=>{THEME={auto:"light",light:"dark",dark:"auto"}[THEME];applyTheme();updateThemeBtn();save()};
  applyTheme();
  render();
}
init();
</script>
